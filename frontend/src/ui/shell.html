<header>
  <div class="brand">
    <div class="brandmark">⌁</div>
    <div><strong data-i18n="app"></strong><small data-i18n="lab"></small></div>
  </div>
  <div class="topnav">
    <span class="muted">01 / <span data-i18n="workspace"></span></span
    ><span class="api-state small"
      ><i class="status-dot"></i><span id="api-state"></span></span
    ><label class="toggle"
      ><input type="checkbox" id="digits" /><span
        data-i18n="digits"
      ></span></label
    ><button id="language" class="language" aria-label="Switch language">
      EN / বাংলা
    </button>
  </div>
</header>
<div class="intro">
  <div>
    <div class="eyebrow" data-i18n="workspace"></div>
    <h1 data-i18n="tagline"></h1>
    <p>DC · RC · MNA</p>
  </div>
  <div class="row">
    <button id="edit" data-i18n="edit"></button
    ><button id="export" class="primary" data-i18n="export"></button>
  </div>
</div>
<main class="layout">
  <aside class="left">
    <section class="panel">
      <div class="panel-head">
        <div class="eyebrow">01 / <span data-i18n="input"></span></div>
        <h2 data-i18n="import"></h2>
      </div>
      <div class="panel-body stack">
        <label
          class="dropzone"
          id="dropzone"
          for="upload"
          role="button"
          tabindex="0"
          ><div class="upload-icon">↥</div>
          <strong data-i18n="drop"></strong><span data-i18n="formats"></span
          ><input
            id="upload"
            class="upload-input"
            type="file"
            accept="image/png,image/jpeg,image/webp,image/heic,.heif,application/pdf" /></label
        ><label
          ><span data-i18n="style.label"></span
          ><select id="style">
            <option value="auto" data-i18n="style.auto"></option>
            <option value="printed" data-i18n="style.printed"></option>
            <option
              value="handwritten"
              data-i18n="style.handwritten"
            ></option></select></label
        ><label class="toggle"
          ><input type="checkbox" id="ai-reader" data-testid="ai-reader" /><span
            data-i18n="reader.enable"
          ></span
        ></label>
        <p class="small reader-disclosure" data-i18n="reader.disclosure"></p>
        <textarea
          id="problem"
          rows="2"
          data-i18n-placeholder="problem"
        ></textarea>
        <div id="upload-name" class="small muted"></div>
        <details id="original-input" hidden>
          <summary data-i18n="original_input"></summary>
          <img
            id="original-preview"
            alt="Original circuit input"
            style="width: 100%"
          />
        </details>
        <label class="small" data-i18n="demo" for="demo"></label
        ><select id="demo"></select>
        <div class="save-row">
          <button id="load" class="small quiet" data-i18n="load"></button
          ><button
            id="image-load"
            class="small quiet"
            data-i18n="image_load"
          ></button
          ><input id="json-upload" type="file" accept=".json" hidden /><input
            id="image-upload"
            type="file"
            accept="image/*"
            hidden
          />
        </div>
      </div>
    </section>
    <section class="panel" id="parameters-panel">
      <div class="panel-head row spread">
        <div>
          <div class="eyebrow">02 / <span data-i18n="explore"></span></div>
          <h2 data-i18n="parameters"></h2>
        </div>
        <span id="parameter-count" class="mono muted small"></span>
      </div>
      <div class="panel-body">
        <div id="controls"></div>
        <label class="toggle" id="keep-controls"
          ><input type="checkbox" id="keep" checked /><span
            data-i18n="keep"
          ></span
        ></label>
      </div>
    </section>
    <section class="panel edit-panel">
      <div class="panel-head"><h2 data-i18n="edit"></h2></div>
      <div class="panel-body">
        <div class="row">
          <button id="undo" data-i18n="undo"></button
          ><button id="redo" data-i18n="redo"></button>
        </div>
        <button id="reset-auto" data-i18n="reset_auto"></button
        ><select id="component-select" aria-label="Component"></select
        ><label
          ><span data-i18n="type"></span
          ><select id="component-type"></select></label
        ><label
          ><span data-i18n="terminal_a"></span
          ><select id="terminal-a"></select></label
        ><label
          ><span data-i18n="terminal_b"></span
          ><select id="terminal-b"></select></label
        ><label
          ><span data-i18n="point_a"></span
          ><select id="terminal-point"></select></label
        ><button id="snap-terminal" data-i18n="connect"></button
        ><button id="split" data-i18n="split"></button>
        <div class="row">
          <button id="place" data-i18n="place"></button
          ><button id="delete" class="danger" data-i18n="delete"></button>
        </div>
        <label
          ><span data-i18n="add"></span
          ><select id="add-type"></select
        ></label>
        <div class="coordinate-pair">
          <label
            ><span data-i18n="ui.x"></span
            ><input type="number" id="place-x" value="300" step="1" /></label
          ><label
            ><span data-i18n="ui.y"></span
            ><input type="number" id="place-y" value="200" step="1"
          /></label>
        </div>
        <button id="add-coordinates" data-i18n="add"></button
        ><button id="add" data-i18n="place"></button>
        <div class="row">
          <select id="merge-a" aria-label="First node"></select
          ><select id="merge-b" aria-label="Second node"></select>
        </div>
        <button id="merge" data-i18n="merge"></button
        ><label
          ><span data-i18n="point_a"></span
          ><select id="wire-a"></select></label
        ><label
          ><span data-i18n="point_b"></span
          ><select id="wire-b"></select></label
        ><button id="wire-add" data-i18n="wire_add"></button
        ><label
          ><span data-i18n="wire"></span
          ><select id="wire-select"></select
        ></label>
        <div class="row">
          <button id="wire-delete" data-i18n="wire_delete"></button
          ><button id="wire-route" data-i18n="wire_route"></button>
        </div>
        <details>
          <summary data-i18n="json"></summary>
          <textarea
            id="netlist-json"
            spellcheck="false"
            aria-label="Netlist JSON"
          ></textarea
          ><button id="apply" data-i18n="apply"></button>
        </details>
        <label class="toggle"
          ><input type="checkbox" id="correction-opt" /><span
            data-i18n="corrections"
          ></span></label
        ><button id="correction-save" data-i18n="correction_save"></button>
      </div>
    </section>
  </aside>
  <section class="center">
    <div id="banner" class="banner" role="status"></div>
    <div class="panel">
      <div class="stage-top">
        <div class="stage-title">
          <span class="eyebrow" data-i18n="simulation"></span
          ><strong id="circuit-title"></strong>
        </div>
        <span class="live"
          ><i class="status-dot"></i><span data-i18n="live"></span
        ></span>
      </div>
      <div id="regions" class="region-tabs"></div>
      <div class="stage-area" id="stage-area">
        <div class="canvas-shell" id="canvas-shell">
          <canvas
            id="overlay"
            tabindex="0"
            role="img"
            aria-label="Interactive circuit overlay"
          ></canvas>
        </div>
      </div>
      <div class="stage-bottom">
        <div class="toolbar">
          <button id="play" data-i18n="pause"></button
          ><button id="restart" data-i18n="reset"></button
          ><select id="analysis-mode" aria-label="Analysis mode">
            <option value="steady" data-i18n="steady"></option>
            <option value="transient" data-i18n="transient"></option>
          </select>
        </div>
        <div class="legend">
          <span>0 V</span><i class="legend-bar"></i
          ><span id="voltage-high"></span>
        </div>
        <div class="row">
          <label data-i18n="zoom" for="zoom"></label
          ><input
            id="zoom"
            type="range"
            min="100"
            max="250"
            value="100"
          /><label class="toggle"
            ><input id="show-image" type="checkbox" checked /><span
              data-i18n="source"
            ></span
          ></label>
        </div>
      </div>
    </div>
    <div class="metrics">
      <div class="metric">
        <span data-i18n="supplied"></span
        ><strong id="supplied" class="mono"></strong
        ><small data-i18n="power"></small>
      </div>
      <div class="metric">
        <span data-i18n="consumed"></span
        ><strong id="consumed" class="mono"></strong
        ><small data-i18n="balance"></small>
      </div>
      <div class="metric">
        <span data-i18n="equivalent"></span
        ><strong id="equivalent" class="mono"></strong
        ><small id="solve-time" class="mono"></small>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head row spread">
        <h2 data-i18n="history"></h2>
        <div class="row time-row">
          <span id="physical-time" class="mono">0 s</span
          ><label data-i18n="time_scale" for="speed"></label
          ><input
            id="speed"
            type="range"
            min="0.1"
            max="3"
            step="0.1"
            value="1"
          />
        </div>
      </div>
      <div class="panel-body">
        <canvas
          id="graph"
          class="graph"
          aria-label="Capacitor voltage and current history"
        ></canvas>
        <div id="graph-caption" class="graph-labels"></div>
      </div>
    </div>
    <div id="short-banner" class="banner short-warning"></div>
    <div class="row">
      <select id="direction" aria-label="Current direction">
        <option value="conventional" data-i18n="conventional"></option>
        <option value="electron" data-i18n="electrons"></option></select
      ><button id="save" class="quiet small" data-i18n="save"></button>
    </div>
  </section>
  <aside class="right">
    <section class="panel">
      <div class="panel-head">
        <div class="eyebrow">03 / <span data-i18n="observe"></span></div>
        <h2 data-i18n="readouts"></h2>
      </div>
      <div class="panel-body">
        <table class="readout-table">
          <thead>
            <tr>
              <th data-i18n="component"></th>
              <th>V</th>
              <th>I</th>
              <th>P</th>
            </tr>
          </thead>
          <tbody id="readout"></tbody>
        </table>
        <div id="nodes" class="nodes"></div>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2 data-i18n="selected"></h2></div>
      <div id="inspector" class="panel-body inspector"></div>
    </section>
    <section class="panel">
      <div class="panel-head row spread">
        <h2 data-i18n="notices"></h2>
        <span id="warning-count" class="small muted"></span>
      </div>
      <div id="notices" class="panel-body notices"></div>
    </section>
  </aside>
</main>
<footer class="footnote" id="footer"></footer>
<div id="toast" role="status" aria-live="polite"></div>
