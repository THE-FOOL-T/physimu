[project]
name = "augphys"
version = "0.1.0"
description = "Physimu source-aligned interactive physics workspace"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F63", "F7", "F82"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["augphys", "augphys.backend", "augphys.backend.app", "augphys.backend.core", "augphys.backend.domains", "augphys.backend.domains.circuit", "augphys.backend.domains.mechanics", "augphys.backend.pipeline", "augphys.backend.pipeline.ocr_hybrid", "augphys.backend.solver", "augphys.backend.tools", "augphys.backend.tools.mechanics", "circuit_sim", "circuit_sim.backend", "circuit_sim.backend.app", "circuit_sim.backend.core", "circuit_sim.backend.domains", "circuit_sim.backend.domains.circuit", "circuit_sim.backend.domains.mechanics", "circuit_sim.backend.pipeline", "circuit_sim.backend.pipeline.ocr_hybrid", "circuit_sim.backend.solver", "circuit_sim.backend.tools", "circuit_sim.backend.tools.mechanics"]
package-dir = {"augphys" = ".", "circuit_sim" = "."}
