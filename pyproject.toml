[project]
name = "circuit-sim"
version = "0.1.0"
description = "Source-aligned interactive circuit simulation"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F63", "F7", "F82"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["circuit_sim", "circuit_sim.backend", "circuit_sim.backend.app", "circuit_sim.backend.pipeline", "circuit_sim.backend.pipeline.ocr_hybrid", "circuit_sim.backend.solver", "circuit_sim.backend.tools"]
package-dir = {"circuit_sim" = "."}
